name: Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400
      - name: Restore
        run: dotnet restore benchmarks/OutlookAligner.Benchmarks/OutlookAligner.Benchmarks.csproj
      - name: Run benchmarks
        run: dotnet run --project benchmarks/OutlookAligner.Benchmarks/OutlookAligner.Benchmarks.csproj -c Release -- --filter "*"
