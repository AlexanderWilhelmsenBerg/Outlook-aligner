name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build, test and Phase 1 probe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Restore
        run: dotnet restore OutlookAligner.sln
      - name: Verify formatting
        run: dotnet format OutlookAligner.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build OutlookAligner.sln -c Release --no-restore
      - name: Test with coverage
        run: dotnet test OutlookAligner.sln -c Release --no-build --no-restore --coverage --coverage-output-format cobertura
      - name: Build benchmark project
        run: dotnet build benchmarks/OutlookAligner.Benchmarks/OutlookAligner.Benchmarks.csproj -c Release --no-restore
      - name: Audit NuGet dependencies
        run: dotnet list OutlookAligner.sln package --vulnerable --include-transitive
      - name: Publish Phase 1 Outlook probe
        run: >-
          dotnet publish src/OutlookAligner.OutlookHost/OutlookAligner.OutlookHost.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false
          --output artifacts/phase1-probe
      - name: Smoke test published executable
        run: .\artifacts\phase1-probe\OutlookAligner.OutlookHost.exe --help
      - name: Upload Phase 1 Outlook probe
        uses: actions/upload-artifact@v7.0.1
        with:
          name: OutlookAligner-Phase1-Probe-win-x64
          path: artifacts/phase1-probe/OutlookAligner.OutlookHost.exe
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Calendar frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/calendar
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Verify formatting
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
