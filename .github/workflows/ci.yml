name: CI

on:
  push:
    branches: [main, phase-3/ui-assisted-testing]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build, test and Windows artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Restore
        run: dotnet restore OutlookAligner.sln
      - name: Verify formatting
        run: dotnet format OutlookAligner.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build OutlookAligner.sln -c Release --no-restore
      - name: Test with coverage
        run: dotnet test OutlookAligner.sln -c Release --no-build --no-restore --coverage --coverage-output-format cobertura
      - name: Build benchmark project
        run: dotnet build benchmarks/OutlookAligner.Benchmarks/OutlookAligner.Benchmarks.csproj -c Release --no-restore
      - name: Audit NuGet dependencies
        run: dotnet list OutlookAligner.sln package --vulnerable --include-transitive
      - name: Publish OutlookHost
        run: >-
          dotnet publish src/OutlookAligner.OutlookHost/OutlookAligner.OutlookHost.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false
          --output artifacts/outlook-host
      - name: Smoke test published OutlookHost
        run: |
          .\artifacts\outlook-host\OutlookAligner.OutlookHost.exe --help
          .\artifacts\outlook-host\OutlookAligner.OutlookHost.exe --interop-check
          .\artifacts\outlook-host\OutlookAligner.OutlookHost.exe --forward-spike --help
      - name: Publish WinUI test harness
        run: >-
          dotnet publish src/OutlookAligner.App/OutlookAligner.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false
          --output artifacts/app
      - name: Assemble UI test bundle
        shell: pwsh
        run: |
          Copy-Item .\artifacts\outlook-host\OutlookAligner.OutlookHost.exe .\artifacts\app\OutlookAligner.OutlookHost.exe -Force
          if (-not (Test-Path .\artifacts\app\OutlookAligner.App.exe)) { throw "WinUI app executable missing" }
          if (-not (Test-Path .\artifacts\app\OutlookAligner.OutlookHost.exe)) { throw "OutlookHost executable missing from UI bundle" }
      - name: Smoke test WinUI startup
        shell: pwsh
        run: |
          $logPath = Join-Path $env:LOCALAPPDATA "OutlookAligner\startup.log"
          $eventLogPath = Join-Path $env:LOCALAPPDATA "OutlookAligner\events.jsonl"
          if (Test-Path $logPath) { Remove-Item $logPath -Force }
          if (Test-Path $eventLogPath) { Remove-Item $eventLogPath -Force }

          $process = Start-Process -FilePath .\artifacts\app\OutlookAligner.App.exe -PassThru
          Start-Sleep -Seconds 5
          $process.Refresh()

          if ($process.HasExited) {
            if (Test-Path $logPath) {
              Write-Host "--- OutlookAligner startup.log ---"
              Get-Content $logPath
              Write-Host "--- end startup.log ---"
            }
            throw "WinUI app exited during startup with code $($process.ExitCode)"
          }

          if (-not (Test-Path $eventLogPath)) {
            throw "Structured diagnostics log was not created during startup"
          }

          $eventLog = Get-Content $eventLogPath -Raw
          if ($eventLog -notmatch 'WinUI session started') {
            throw "Structured diagnostics log did not contain the expected session-start event"
          }

          Stop-Process -Id $process.Id -Force
      - name: Upload Phase 3 UI test harness
        uses: actions/upload-artifact@v7.0.1
        with:
          name: OutlookAligner-Phase3-UI-TestHarness-win-x64
          path: artifacts/app/**
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Calendar frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/calendar
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Verify formatting
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
